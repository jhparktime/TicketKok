name: Release Agent Evaluation

on:
  workflow_dispatch:
    inputs:
      run_remote_holdout:
        description: "Run the 10-case ADK holdout against the protected staging MCP"
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - "CouponPilotAgent/**"
      - "CouponPilotBackend/src/calculator.ts"
      - "CouponPilotBackend/src/mcpServer.ts"
      - "CouponPilotBackend/test/**"
      - "pipelines/**"
      - ".github/workflows/release-agent-eval.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deterministic-contracts:
    name: Calculator, MCP and privacy contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CouponPilotBackend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify backend deterministic contracts
        working-directory: CouponPilotBackend
        run: |
          npm ci
          npm run build
          npm test
      - name: Verify ADK guardrails and holdout schema
        working-directory: CouponPilotAgent
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python scripts/check_prompt_versions.py
          pytest -q
      - name: Verify and compile offline Vertex Pipeline gates
        run: |
          python -m pip install -e ./pipelines pytest
          python -m pytest -q pipelines/tests
          python -m couponcok_pipelines.compile --output /tmp/couponcok-governance-gates.json

  remote-holdout:
    name: Protected staging ADK holdout
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_remote_holdout }}
    needs: deterministic-contracts
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_EVAL_SERVICE_ACCOUNT }}
      - name: Run exact-order release holdout
        working-directory: CouponPilotAgent
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: global
          ADK_MODEL: gemini-2.5-flash
          MCP_SERVER_URL: ${{ secrets.MCP_STAGING_URL }}
          MCP_INTERNAL_TOKEN: ${{ secrets.MCP_STAGING_TOKEN }}
        run: |
          test -n "$MCP_SERVER_URL"
          test -n "$MCP_INTERNAL_TOKEN"
          python -m pip install --upgrade pip
          python -m pip install -e .
          adk eval couponcok_agent evals/couponcok_release_holdout.evalset.json \
            --config_file_path evals/release_holdout_config.json
