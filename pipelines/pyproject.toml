[project]
name = "couponcok-vertex-pipelines"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-cloud-aiplatform==1.132.0",
  "kfp==2.15.2",
]

[project.scripts]
couponcok-pipeline-compile = "couponcok_pipelines.compile:main"
couponcok-pipeline-submit = "couponcok_pipelines.submit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
