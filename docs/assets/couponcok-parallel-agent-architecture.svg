<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1e3a5f" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4f6ee8"/></marker>
    <style>
      .title{font:700 34px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#14213d}.subtitle{font:500 18px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#63718a}.group{font:700 23px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#1d4ed8}.box-title{font:700 20px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#14213d}.box-text{font:500 16px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#42526b}.small{font:500 14px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#516079}.tiny{font:600 13px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#5d3aa8}.step{font:700 16px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#ffffff}.pill{font:700 14px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#3553b8}.security{font:700 17px 'Apple SD Gothic Neo','Noto Sans KR',Arial,sans-serif;fill:#2c4778}
    </style>
  </defs>
  <rect width="1800" height="1800" fill="#fbfdff"/>
  <g transform="translate(0 210)">
  <text x="80" y="78" class="title">CouponKok · 병렬 Multi-Agent 및 MCP 아키텍처</text>
  <text x="80" y="112" class="subtitle">금액은 Calculator MCP Tool만 확정하고, Gemini는 공식 근거 기반 설명만 생성</text>

  <!-- Column headers -->
  <text x="98" y="170" class="group">1  Client</text>
  <text x="370" y="170" class="group">2  Identity</text>
  <text x="650" y="170" class="group">3  Cloud Run API</text>
  <text x="980" y="170" class="group" fill="#7c3aed">4  ADK Workflow</text>
  <text x="1400" y="170" class="group">5  MCP · Data</text>

  <!-- Client -->
  <g filter="url(#shadow)"><rect x="75" y="195" width="225" height="500" rx="26" fill="#fff" stroke="#9db6ff" stroke-width="2"/></g>
  <rect x="100" y="220" width="175" height="88" rx="18" fill="#eef4ff"/>
  <text x="188" y="257" text-anchor="middle" class="box-title">iPhone 앱</text><text x="188" y="283" text-anchor="middle" class="box-text">SwiftUI</text>
  <g><rect x="100" y="330" width="175" height="58" rx="14" fill="#f6f9ff"/><text x="188" y="365" text-anchor="middle" class="box-text">Vision OCR · 로컬 마스킹</text></g>
  <g><rect x="100" y="402" width="175" height="58" rx="14" fill="#f6f9ff"/><text x="188" y="437" text-anchor="middle" class="box-text">Core Location · 지오펜스</text></g>
  <g><rect x="100" y="474" width="175" height="58" rx="14" fill="#f6f9ff"/><text x="188" y="509" text-anchor="middle" class="box-text">로컬 알림 · HITL</text></g>
  <g><rect x="100" y="548" width="175" height="116" rx="14" fill="#ecfdf5" stroke="#86efac"/><text x="188" y="581" text-anchor="middle" class="box-title" fill="#166534">SecureCouponBarcodeStore</text><text x="188" y="608" text-anchor="middle" class="box-text">iPhone Keychain 암호화 저장</text><text x="188" y="634" text-anchor="middle" class="small">서버 · Firebase · Gemini 미전송</text></g>

  <!-- Firebase -->
  <g filter="url(#shadow)"><rect x="345" y="195" width="235" height="500" rx="26" fill="#fff" stroke="#9db6ff" stroke-width="2"/></g>
  <rect x="370" y="225" width="185" height="120" rx="18" fill="#fff8e7"/>
  <text x="462" y="267" text-anchor="middle" class="box-title">Firebase Authentication</text><text x="462" y="295" text-anchor="middle" class="box-text">익명 인증 + Apple 계정 연결</text><text x="462" y="321" text-anchor="middle" class="small">Firebase ID Token</text>
  <rect x="370" y="370" width="185" height="92" rx="18" fill="#effcf7"/><text x="462" y="409" text-anchor="middle" class="box-title">Firebase App Check</text><text x="462" y="437" text-anchor="middle" class="box-text">monitor 모드</text>
  <rect x="370" y="487" width="185" height="142" rx="18" fill="#f6f9ff"/><text x="462" y="528" text-anchor="middle" class="box-title">동의 관리</text><text x="462" y="556" text-anchor="middle" class="box-text">필수 처리 · 개인화 · 위치</text><text x="462" y="584" text-anchor="middle" class="small">알림 동의 분리</text>

  <!-- API -->
  <g filter="url(#shadow)"><rect x="625" y="195" width="290" height="500" rx="26" fill="#fff" stroke="#9db6ff" stroke-width="2"/></g>
  <rect x="650" y="225" width="240" height="120" rx="18" fill="#eef4ff"/><text x="770" y="269" text-anchor="middle" class="box-title">Cloud Run API</text><text x="770" y="297" text-anchor="middle" class="box-text">Firebase Token 검증 · HMAC 가명화</text><text x="770" y="323" text-anchor="middle" class="small">추천 오케스트레이션</text>
  <rect x="650" y="370" width="240" height="96" rx="18" fill="#ecfdf5"/><text x="770" y="408" text-anchor="middle" class="box-title">결정론적 추천 경로</text><text x="770" y="437" text-anchor="middle" class="box-text">쿠폰 · RAG · Calculator 결과 유지</text>
  <rect x="650" y="491" width="240" height="137" rx="18" fill="#faf5ff" stroke="#d8b4fe"/><text x="770" y="530" text-anchor="middle" class="box-title">선택적 ADK 호출</text><text x="770" y="558" text-anchor="middle" class="box-text">shadow / explanation 모드</text><text x="770" y="586" text-anchor="middle" class="small">Agent 장애 시에도 쿠폰 단독 계산</text>

