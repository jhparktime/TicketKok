  <g filter="url(#shadow)"><rect x="950" y="195" width="400" height="500" rx="26" fill="#fff" stroke="#c4b5fd" stroke-width="2"/></g>
  <text x="1150" y="225" text-anchor="middle" class="box-title" fill="#5b21b6">ADK Workflow · max concurrency 2</text>
  <rect x="980" y="245" width="135" height="68" rx="15" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1047" y="275" text-anchor="middle" class="box-title">Store Agent</text><text x="1047" y="298" text-anchor="middle" class="small">매장 맥락</text>
  <rect x="1185" y="245" width="135" height="68" rx="15" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1252" y="275" text-anchor="middle" class="box-title">Personalization</text><text x="1252" y="298" text-anchor="middle" class="small">동의된 집계 이력</text>
  <path d="M1047 313 L1130 325 M1252 313 L1170 325" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1150" cy="335" r="25" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="1150" y="340" text-anchor="middle" class="small">Join</text>
  <path d="M1150 360 V382" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="980" y="396" width="135" height="68" rx="15" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1047" y="426" text-anchor="middle" class="box-title">Coupon Agent</text><text x="1047" y="449" text-anchor="middle" class="small">후보 선별</text>
  <rect x="1185" y="396" width="135" height="68" rx="15" fill="#f5f3ff" stroke="#c4b5fd"/><text x="1252" y="426" text-anchor="middle" class="box-title">Benefit Agent</text><text x="1252" y="449" text-anchor="middle" class="small">공식 혜택 RAG</text>
  <path d="M1047 464 L1130 483 M1252 464 L1170 483" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="1150" cy="493" r="25" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="1150" y="498" text-anchor="middle" class="small">Join</text>
  <path d="M1150 518 V538" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1018" y="550" width="264" height="66" rx="15" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/><text x="1150" y="579" text-anchor="middle" class="box-title">Recommendation Agent · Gemini</text><text x="1150" y="602" text-anchor="middle" class="small">계산 결과·공식 근거 기반 설명만 생성</text>
  <rect x="980" y="640" width="340" height="35" rx="16" fill="#f8fafc"/><text x="1150" y="663" text-anchor="middle" class="tiny">상태 계약: completed · skipped · blocked · failed</text>

  <!-- MCP & Data -->
  <g filter="url(#shadow)"><rect x="1385" y="195" width="335" height="500" rx="26" fill="#fff" stroke="#9db6ff" stroke-width="2"/></g>
  <rect x="1410" y="225" width="285" height="92" rx="18" fill="#ecfdf5" stroke="#6ee7b7"/><text x="1552" y="262" text-anchor="middle" class="box-title">Private MCP Tool Service</text><text x="1552" y="290" text-anchor="middle" class="box-text">내부 토큰 · Cloud Run IAM</text>
  <rect x="1410" y="337" width="136" height="65" rx="14" fill="#f6f9ff"/><text x="1478" y="365" text-anchor="middle" class="box-title">Store Tools</text><text x="1478" y="388" text-anchor="middle" class="small">매장·지도 검증</text>
  <rect x="1559" y="337" width="136" height="65" rx="14" fill="#f6f9ff"/><text x="1627" y="365" text-anchor="middle" class="box-title">RAG Tool</text><text x="1627" y="388" text-anchor="middle" class="small">공식 혜택 검색</text>
  <rect x="1410" y="420" width="285" height="84" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="1552" y="453" text-anchor="middle" class="box-title">Calculator Tool</text><text x="1552" y="481" text-anchor="middle" class="box-text">최종가 · 절약액 · 가격 기준 순위만 확정</text>
  <rect x="1410" y="528" width="285" height="126" rx="16" fill="#f8fafc"/><text x="1552" y="560" text-anchor="middle" class="box-title">승인된 데이터</text><text x="1552" y="588" text-anchor="middle" class="box-text">Firestore · Cloud Storage RAG</text><text x="1552" y="614" text-anchor="middle" class="box-text">data.go.kr · 지도 API fallback</text><text x="1552" y="640" text-anchor="middle" class="small">공식성·유효기간·권리 확인</text>

  <!-- Main arrows -->
  <path d="M300 445 H345" stroke="#4f6ee8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M580 445 H625" stroke="#4f6ee8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M915 555 H950" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
  <text x="924" y="535" class="small" fill="#7c3aed">선택적</text>
  <path d="M1350 583 H1385" stroke="#8b5cf6" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1410 462 H1350" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- HITL -->
  <g filter="url(#shadow)"><rect x="400" y="745" width="1000" height="126" rx="24" fill="#fff" stroke="#d8b4fe" stroke-width="2"/></g>
  <text x="450" y="785" class="box-title" fill="#6b21a8">Human-in-the-Loop</text>
  <rect x="650" y="765" width="180" height="72" rx="18" fill="#faf5ff"/><text x="740" y="796" text-anchor="middle" class="box-title">사용자 추천 확인</text><text x="740" y="821" text-anchor="middle" class="small">자동 사용 처리 금지</text>
  <path d="M830 801 H875" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="890" y="765" width="180" height="72" rx="18" fill="#faf5ff"/><text x="980" y="796" text-anchor="middle" class="box-title">실제 바코드 표시</text><text x="980" y="821" text-anchor="middle" class="small">기기 Keychain 복원</text>
  <path d="M1070 801 H1115" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1130" y="765" width="215" height="72" rx="18" fill="#faf5ff"/><text x="1237" y="796" text-anchor="middle" class="box-title">결제 완료·사용 처리</text><text x="1237" y="821" text-anchor="middle" class="small">5초 실행 취소 · 기록 복원</text>

  <!-- Security -->
  <g filter="url(#shadow)"><rect x="75" y="920" width="1645" height="105" rx="24" fill="#f5f8ff" stroke="#b8c8f4" stroke-width="2"/></g>
  <text x="115" y="960" class="security">보안 · 관측 기반</text>
  <text x="405" y="960" class="security">Secret Manager</text><text x="405" y="987" class="small">키·내부 토큰 분리</text>
  <text x="675" y="960" class="security">Cloud DLP</text><text x="675" y="987" class="small">민감정보 재검사</text>
  <text x="930" y="960" class="security">Model Armor</text><text x="930" y="987" class="small">monitor / enforce 전환 구조</text>
  <text x="1240" y="960" class="security">OpenTelemetry · Cloud Trace</text><text x="1240" y="987" class="small">Cloud Logging · 속성 살균</text>
  </g>
</svg>
